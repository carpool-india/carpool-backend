version: "3.8"
services:
  booking:
    build:
      context: .
      dockerfile: backend/services/booking/Dockerfile
    ports:
      - "3002:3002"
    env_file: .env
  matching:
    build:
      context: ./backend/services/matching
    ports:
      - "8001:8001"
    env_file: .env
    environment:
      PYTHONPATH: /app
  payment:
    build:
      context: .
      dockerfile: backend/services/payment/Dockerfile
    ports:
      - "3003:3003"
    env_file: .env
  notification:
    build:
      context: .
      dockerfile: backend/services/notification/Dockerfile
    ports:
      - "3005:3005"
    env_file: .env
  safety:
    build:
      context: .
      dockerfile: backend/services/safety/Dockerfile
    ports:
      - "3006:3006"
    env_file: .env
  centrifugo:
    image: centrifugo/centrifugo:v5
    command: centrifugo -c config.json
    volumes:
      - ./backend/centrifugo/config.json:/centrifugo/config.json
    ports:
      - "8010:8000"
